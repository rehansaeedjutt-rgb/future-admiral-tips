name: Daily Trading Tips

on:
  schedule:
    # Har roz subah 11:00 PKT (6:00 UTC) par chalega
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual chalane ke liye

jobs:
  send_tip:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Fetch and Send Daily Tip
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python fetch_tips.py
